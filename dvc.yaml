stages:
  # load_data:
  #   always_changed: true
  #   deps:
  #     - data/raw/raw.csv

  preprocess_data:
    cmd: python -m src.data_preprocessing.preprocess_data
    deps:
      - src/data_preprocessing/preprocess_data.py
      - data/raw/churn.csv
    outs:
      - data/preprocessed/X_test.csv
      - data/preprocessed/X_train.csv
      - data/preprocessed/y_test.csv
      - data/preprocessed/y_train.csv
    params:
      - preprocess_data.test_size
      - preprocess_data.random_seed

  engineer_features:
    cmd: python -m src.feature_engineering.engineer_features
    deps:
      - src/feature_engineering/engineer_features.py
      - data/preprocessed/X_test.csv
      - data/preprocessed/X_train.csv
      - data/preprocessed/y_test.csv
      - data/preprocessed/y_train.csv
    outs:
      - data/processed/X_test_processed.csv
      - data/processed/X_train_processed.csv
      - data/processed/y_test_processed.csv
      - data/processed/y_train_processed.csv
      - artifacts/[features]_ohe.joblib
      - artifacts/[target]_label.joblib
      

  train:
    cmd: python -m src.model_training.train_model
    deps:
      - src/model_training/train_model.py
      - data/processed/X_train_processed.csv
      - data/processed/y_train_processed.csv
    outs:
      - models/model.xgboost
    metrics:
      - metrics/training.json
    params:
      - train.colsample_bytree
      - train.learning_rate 
      - train.max_depth
      - train.n_estimators

  evaluate:
    cmd: python -m src.model_evaluation.evaluate_model
    deps:
      - src/model_evaluation/evaluate_model.py
      - models/model.xgboost
      - artifacts/[features]_ohe.joblib
      - data/processed/X_test_processed.csv
      - data/processed/y_test_processed.csv
    metrics:
      - metrics/evaluation.json